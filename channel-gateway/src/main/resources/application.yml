spring:
  threads:
    virtual:
      enabled: true # JDK 21 虚拟线程开启
  profiles:
    # 同一套代码部署多实例：默认 dev（三渠道联调入口，18080）；
    # 生产通过 --spring.profiles.active=internet / intranet 指定实例。
    # local 仅作为所选实例的附加 profile 由 group 引入，禁止无条件 include dev，
    # 否则 internet/intranet 实例会加载 application-dev.yml 的三渠道直连路由与白名单。
    default: dev
    group:
      internet: local
      intranet: local
      dev: local

  # Redis 连接池（环境无关）；host/port/database 等连接配置在 application-local.yml
  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

  cloud:
    gateway.server.webflux:
      httpclient:
        connect-timeout: 5000
        response-timeout: 600000

logging:
  file:
    path: /applog/${spring.application.name}
    name: ${spring.application.name}.log
  logback:
    rollingpolicy:
      total-size-cap: 1GB
      max-history: 30

# 报文加密配置（各实例 profile 可按渠道安全要求开启）
gateway:
  crypto:
    enabled: false
    secret-key: ${SM4_SECRET_KEY:}

## sa-token 配置(网关层 Reactive WebFlux)
## 各渠道专属配置(token-name 等)由 ChannelAwareSaRouter 按 StpLogic 覆盖
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: tik
  is-read-header: true
  is-read-cookie: false
  is-log: false
