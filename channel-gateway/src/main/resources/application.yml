spring:
  threads:
    virtual:
      enabled: true # JDK 21 虚拟线程开启
  profiles:
    # 本机覆盖（注册中心/Redis/签名密钥/日志级别）始终经 local 加载，生产环境用环境变量覆盖；
    # 同一套代码部署多实例：默认激活 dev 实例（三渠道联调入口，18080），
    # 生产按 --spring.profiles.active=internet（互联网渠道）/ intranet（内网渠道）指定实例，
    # 服务名与实例专属配置（路由/渠道/白名单）在各实例的 application-{profile}.yml 中
    include: local,dev

  # Redis 连接池（环境无关）；host/port/database 等连接配置在 application-local.yml
  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

  cloud:
    gateway.server.webflux:
      httpclient:
        connect-timeout: 5000
        response-timeout: 600000

logging:
  file:
    path: /applog/${spring.application.name}
    name: ${spring.application.name}.log
  logback:
    rollingpolicy:
      total-size-cap: 1GB
      max-history: 30

# 报文加密配置（各实例 profile 可按渠道安全要求开启）
gateway:
  crypto:
    enabled: false
    secret-key: ${SM4_SECRET_KEY:}

## sa-token 配置(网关层 Reactive WebFlux)
## 各渠道专属配置(token-name 等)由 ChannelAwareSaRouter 按 StpLogic 覆盖
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: tik
  is-read-header: true
  is-read-cookie: false
  is-log: false
