# ============ 开发联调入口（三渠道齐备，承接原 demo-gateway 职责） ============
# 启动方式: --spring.profiles.active=dev
server:
  port: 18080

spring:
  application:
    name: gateway

  cloud:
    gateway.server.webflux:
      discovery.locator:
        enabled: true
        lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            # 允许的前端来源 —— 精准白名单
            allowed-origins:
              - "https://com.example"
            allowed-origin-patterns:
              - "http://localhost:*"
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            # 允许的请求头(包含 sa-token 三渠道 Header)
            allowed-headers:
              - "Content-Type"
              - "Authorization"
              - "X-Tenant-Id"
              - "X-Requested-With"
              - "satoken-internet"
              - "satoken-hq"
              - "satoken-branch"
            exposed-headers:
              - "X-Trace-Id"
              - "X-Request-Id"
            allow-credentials: true
            max-age: 3600
      routes:
        # ============ auth-service(三渠道认证授权) ============
        - id: auth-service-internet-route
          uri: lb://auth-service
          predicates:
            - Path=/internet/auth/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Gateway-Source, channel-gateway
        - id: auth-service-hq-route
          uri: lb://auth-service
          predicates:
            - Path=/hq/auth/**
          filters:
            - StripPrefix=1
        - id: auth-service-branch-route
          uri: lb://auth-service
          predicates:
            - Path=/branch/auth/**
          filters:
            - StripPrefix=1
        # auth-service 通用路由(管理接口)
        - id: auth-service-admin-route
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        # ============ BFF(渠道聚合层) ============
        - id: internet-bff-route
          uri: lb://internet-bff
          predicates:
            - Path=/internet/**
          filters:
            - StripPrefix=1
        - id: intranet-bff-hq-route
          uri: lb://intranet-bff
          predicates:
            - Path=/hq/**
          filters:
            - StripPrefix=1
        - id: intranet-bff-branch-route
          uri: lb://intranet-bff
          predicates:
            - Path=/branch/**
          filters:
            - StripPrefix=1
        # ============ 业务服务(开发环境直连，便于联调) ============
        - id: integration-service-route
          uri: lb://cjannuity-channel-integration
          predicates:
            - Path=/integration/**
          filters:
            - StripPrefix=1
        - id: approval-service-route
          uri: lb://approval-service
          predicates:
            - Path=/approval/**
          filters:
            - StripPrefix=1
        - id: file-service-route
          uri: lb://file-service
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: annuity-service-route
          uri: lb://annuity-service
          predicates:
            - Path=/annuity/**
          filters:
            - StripPrefix=1

# 开发统一入口：启用全部三渠道
gateway:
  channels:
    enabled:
      - INTERNET
      - HQ
      - BRANCH
  # 开发环境路由黑名单示例
  exclude-routes:
    default-status: 403
    rules:
      - path: /aaa/**
        methods: [ GET, POST ]
        status: 404
      - path: /internal/**

# 网关层 auth 配置（全量白名单）
auth:
  gateway:
    public-paths:
      - /actuator/**
      - /actuator
      - /favicon.ico
      - /internet/auth/login
      - /hq/auth/login
      - /branch/auth/login
      - /branch/auth/secondary-auth/initiate
      - /branch/auth/secondary-auth/confirm
      - /branch/auth/secondary-auth/status/**
      # 管理后台登录接口
      - /admin/auth/login
