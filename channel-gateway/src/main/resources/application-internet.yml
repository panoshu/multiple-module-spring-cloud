# ============ 互联网渠道入口 ============
# 部署方式: --spring.profiles.active=internet
server:
  port: 18081

spring:
  application:
    name: internet-gateway

  cloud:
    gateway.server.webflux:
      discovery.locator:
        enabled: true
        lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            # 允许的前端来源 —— 精准白名单
            allowed-origins:
              - "https://com.example"
            allowed-origin-patterns:
              - "http://localhost:*"
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            allowed-headers:
              - "Content-Type"
              - "Authorization"
              - "X-Tenant-Id"
              - "X-Requested-With"
              - "satoken-internet"
            exposed-headers:
              - "X-Trace-Id"
              - "X-Request-Id"
            allow-credentials: true
            max-age: 3600
      routes:
        # ============ internet-bff(互联网 BFF) ============
      # ============ auth-service(网上渠道认证授权) ============
        - id: auth-service-internet-route
          # 生产经 Nacos 服务发现（lb://）；local 可经 auth.route.uri 直连
          # （SCA 2025.0.0.0-preview 的 gRPC 订阅与 Nacos 3.x 存在兼容缺口，实测拉不到实例 503）
          uri: ${auth.route.uri:lb://auth-service}
          predicates:
            - Path=/internet/auth/**
          filters:
            - StripPrefix=1

# 互联网网关仅启用 INTERNET 渠道
gateway:
  channels:
    enabled:
      - INTERNET

# 网关层 auth 配置（白名单等）
auth:
  gateway:
    public-paths:
      - /actuator/**
      - /actuator
      - /favicon.ico
      - /internet/auth/login
      # file-service Token 自鉴权端点（批次5/设计决策 D4：file token 机制自成鉴权体系，
      # 跳过 sa-token 会话校验——上传/下载由 X-File-Token 短时效+一次性+会话比对保障）
      - /internet/file/api/file/access/upload-tokens
      - /internet/file/api/file/access/upload
      - /internet/file/api/file/access/download-tokens
      - /internet/file/api/file/access/download
