spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848
  # 本地 Redis：与 auth/file/annuity 保持同一连接配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: redis
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 功能权限校验: 通过 HttpExchange 调用 auth-service
# 库 3.5.5 配置前缀为 http-exchange；旧的 httpexchange.clients.<包>.url 不生效
http-exchange:
  base-url: lb://auth-service

permission:
  # 会话签名验证：验证网关签发的 X-Account-Id / X-Session-Context 签名防伪造
  # 生产环境通过环境变量 PERMISSION_SESSION_SIGNATURE_KEY 注入
  session:
    signature-key: dev-session-signature-key-2026

shared:
  # 事件通道：与 file/approval/annuity 一致，本地统一走 RocketMQ 5.x Proxy(gRPC 8081)
  event:
    redis:
      enabled: false
    rocketmq:
      enabled: true
      endpoints: http://127.0.0.1:8081
      topic: event
  logging:
    database:
      enable: true
    file:
      enable: true
    timing:
      enable: true
    obfuscate:
      global:
        enable: true
        replacement: "***"
        enable-wildcard-paths: true

      fields:
        password:
          aliases:
            - $.password
            - $.user.credentials.password
            - $.data.personalInfo.authentication.passwd
            - $.users[*].credentials.password
            - $..password
            - header.authorization
            - header.auth-token
            - query.password
            - query.pwd
          strategy: PARTIAL_HIDE
          replacement: "******"
          params:
            show-prefix: 3
            show-suffix: 4

        phone:
          aliases:
            - $.phone
            - $.mobile
            - $.contact.phoneNumber
            - $.users[*].contact.phone
            - $..phone
            - $..mobile
            - header.x-phone
            - query.phone
            - query.mobile
          strategy: KEEP_FIRST_LAST
          params:
            show-prefix: 3
            show-suffix: 4

        email:
          aliases:
            - $.email
            - $.user.email
            - $.contact.email
            - $..email
            - header.x-email
            - query.email
          strategy: PARTIAL_HIDE
          params:
            show-prefix: 3
            show-suffix: 3

        creditCard:
          aliases:
            - $.creditCard
            - $.cardNumber
            - $.payment.card
            - $..creditCard
            - $..cardNumber
          strategy: PATTERN_REGEX
          params:
            pattern: "\\b\\d{4}[ -]?\\d{4}[ -]?\\d{4}[ -]?\\d{4}\\b"
            replacement: "****-****-****-****"

        token:
          aliases:
            - $.token
            - $.accessToken
            - $.refreshToken
            - $..token
            - header.x-api-key
            - header.x-auth-token
            - header.authorization
          strategy: HASH_SHA256

      strategies:
        PARTIAL_HIDE:
          params:
            show-prefix: 3
            show-suffix: 3
        KEEP_FIRST_LAST:
          params:
            show-prefix: 1
            show-suffix: 1
        PATTERN_REGEX:
          params:
            replacement: "***"
        FULL: { }
        HASH_SHA256: { }

logbook:
  filter:
    enabled: true
  predicate:
    include:
      - path: /api/**
        methods:
          - GET
          - POST
      - path: /actuator/**
    exclude:
      - path: /h2-console/**

logging:
  level:
    root: INFO
    com.example: INFO
    com.example.shared.web.trace: INFO
    org.zalando.logbook: TRACE
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR
    com.example.shared.logging.writer.impl.com.example.shared.logging.writer.impl.FileLogExporter: INFO
