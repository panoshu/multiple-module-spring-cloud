# sofa registry settings
spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848 # nacos / tkEAaj3OIk
    gateway.server.webflux:
      discovery.locator:
        enabled: true
        lower-case-service-id: true
      routes:
        # ============ auth-service(三渠道认证授权) ============
        # 网上渠道认证授权
        - id: auth-service-internet-route
          uri: lb://auth-service
          predicates:
            - Path=/internet/auth/**
          filters:
            - StripPrefix=0
            - AddRequestHeader=X-Gateway-Source, demo-gateway
        # 总部渠道认证授权
        - id: auth-service-hq-route
          uri: lb://auth-service
          predicates:
            - Path=/hq/auth/**
          filters:
            - StripPrefix=0
        # 网点渠道认证授权
        - id: auth-service-branch-route
          uri: lb://auth-service
          predicates:
            - Path=/branch/auth/**
          filters:
            - StripPrefix=0
        # auth-service 通用路由(管理接口)
        - id: auth-service-admin-route
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        # ============ business-core-kernel(核心业务服务) ============
        - id: business-core-route
          uri: lb://business-core-kernel
          predicates:
            - Path=/business/**
          filters:
            - StripPrefix=1
        # ============ product-service(客户服务) ============
        - id: product-service-route
          uri: lb://product-service
          predicates:
            - Path=/product/**
          filters:
            - StripPrefix=1
        # ============ 其他业务服务 ============
        - id: consumer-service-route
          uri: lb://consumer
          predicates:
            - Path=/consumer/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=X-Gateway-Source, demo-gateway
        - id: integration-service-route
          uri: lb://integration
          predicates:
            - Path=/integration/**
          filters:
            - StripPrefix=1
        - id: approval-service-route
          uri: lb://approval-service
          predicates:
            - Path=/approval/**
          filters:
            - StripPrefix=1
        - id: file-service-route
          uri: lb://file-service
          predicates:
            - Path=/file/**
          filters:
            - StripPrefix=1
        - id: annuity-service-route
          uri: lb://annuity-service
          predicates:
            - Path=/annuity/**
          filters:
            - StripPrefix=1

gateway:
  exclude-routes:
    default-status: 403
    rules:
      - path: /aaa/**
        methods: [ GET, POST ]
        status: 404
      - path: /internal/**

# 会话签名配置：网关对 X-Account-Id / X-Session-Context 签名，业务服务验签防伪造
# 生产环境通过环境变量 PERMISSION_SESSION_SIGNATURE_KEY 注入，禁止使用此开发密钥
permission:
  session:
    signature-key: dev-session-signature-key-2026
    ttl-seconds: 300

logging:
  level:
    root: INFO
    com.example: INFO
    org.springframework: ERROR
    org.springframework.cloud: ERROR
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
    reactor.netty.http.client: INFO
    reactor.netty.http.server.AccessLog: INFO
