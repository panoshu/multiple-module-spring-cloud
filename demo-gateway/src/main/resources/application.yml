server:
  port: 18080

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true # JDK 21 虚拟线程开启
  profiles:
    include: local

  # Redis 连接配置(sa-token 分布式会话使用,详见 https://sa-token.cc/doc.html#/up/integ-redis)
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms

  cloud:
    gateway.server.webflux:
      httpclient:
        connect-timeout: 5000
        response-timeout: 600000

      globalcors:
        cors-configurations:
          '[/**]':
            # 允许的前端来源 —— 精准白名单
            allowed-origins:
              - "https://com.example"
            # 支持通配模式 localhost 任意端口
            allowed-origin-patterns:
              - "http://localhost:*"
            allowed-methods:
              - GET
              - POST
              - OPTIONS
            # 允许的请求头(包含 sa-token 三渠道 Header)
            allowed-headers:
              - "Content-Type"
              - "Authorization"
              - "X-Tenant-Id"
              - "X-Requested-With"
              - "satoken-internet"
              - "satoken-hq"
              - "satoken-branch"
            # 前端可读取的响应头
            exposed-headers:
              - "X-Trace-Id"
              - "X-Request-Id"
            # 是否允许 Cookie / JWT
            allow-credentials: true
            # 预检缓存时间
            max-age: 3600

