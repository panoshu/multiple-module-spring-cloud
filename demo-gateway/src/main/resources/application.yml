logging:
  file:
    path: /applog/${spring.application.name}
    name: ${spring.application.name}.log
  logback:
    rollingpolicy:
      total-size-cap: 1GB
      max-history: 30

# 报文加密配置
gateway:
  crypto:
    enabled: false
    secret-key: ${SM4_SECRET_KEY:}
    # exclude-paths:
    #   - /api/public/**
    # fields:
    #   phone:
    #     aliases: [mobile, phoneNumber, tel]
    #   idCard:
    #     aliases: [idNumber, id_card]
    #   realName:
    #     aliases: [name, userName]
  # 渠道注册配置（开发统一入口：启用全部三渠道）
  channels:
    enabled:
      - INTERNET
      - HQ
      - BRANCH

## sa-token 配置(网关层 Reactive WebFlux,详见 https://sa-token.cc/doc.html#/micro/gateway-auth)
## 各渠道专属配置(如 token-name / timeout / is-concurrent)在 iam-service 的 SaTokenConfiguration 中通过 StpLogic.setConfig 覆盖
sa-token:
  # Token 名称(默认值,实际每渠道独立 Header 通过 StpLogic.config 覆盖)
  token-name: satoken
  # Token 有效期(秒),30 天(由 iam-service 渠道级配置覆盖)
  timeout: 2592000
  # Token 临时活跃超时(秒),30 分钟(超出时间未操作则失效)
  active-timeout: 1800
  # 是否允许同一账号并发登录(由 iam-service 渠道级配置覆盖)
  is-concurrent: true
  # 在多人登录同一账号时,是否共用一个 Token
  is-share: false
  # Token 风格:tik(推荐,与 iam-service 保持一致)
  token-style: tik
  # 是否从 Header 中读取 Token(默认 true,显式声明避免歧义)
  is-read-header: true
  # 是否从 Cookie 中读取 Token(关闭以避免 CSRF 风险)
  is-read-cookie: false
  # 是否输出操作日志
  is-log: false

## 网关层 auth 配置（白名单等）
auth:
  gateway:
    # 公共白名单路径(无需登录校验)——被 GatewayProperties 消费，替代硬编码 addExclude
    public-paths:
      - /actuator/**
      - /actuator
      - /favicon.ico
      - /internet/auth/login
      - /hq/auth/login
      - /branch/auth/login
      - /branch/auth/secondary-auth/initiate
      - /branch/auth/secondary-auth/confirm
      - /branch/auth/secondary-auth/status/**
      # 管理后台登录接口
      - /admin/auth/login

