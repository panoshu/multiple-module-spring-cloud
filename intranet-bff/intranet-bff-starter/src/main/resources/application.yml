server:
  port: 18091
  servlet:
    context-path: /intranet-bff

spring:
  application:
    name: intranet-bff
  threads:
    virtual:
      enabled: true
  profiles:
    active: local

# BFF 渠道范围
bff:
  channel-scope: INTRANET

trace:
  context:
    mapping:
      OrderId: X-Order-Id
      UserId: X-User-Id
      BizId: X-Biz-Id
      BatchId: X-Batch-Id
      # 会话账号与签名透传：approval-service 的 AccountIdResolver 依赖这两个 header
      # 解析当前审批人（批次 56 越权治理），缺失时服务端 fail-closed 拒绝查询
      AccountId: X-Account-Id
      AccountSig: X-Account-Sig

logging:
  level:
    com.example.bff: DEBUG
