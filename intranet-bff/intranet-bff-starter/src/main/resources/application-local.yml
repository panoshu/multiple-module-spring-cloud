# 本机环境配置：注册中心连接与服务间客户端地址、调试日志级别
spring:
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}

# HttpExchange 客户端代理配置（库 3.5.5 使用 http-exchange.channels，旧写法不生效）
http-exchange:
  channels:
    - name: approval
      base-url: lb://approval-service
      clients:
        - com.example.approval.api.**
    - name: auth
      base-url: lb://auth-service
      clients:
        - com.example.auth.api.**
    - name: annuity
      base-url: lb://annuity-service
      clients:
        - com.example.annuity.api.kernel.**

logging:
  level:
    com.example.bff: DEBUG
