# NOTE: Should be moved to auth-starter when that module is created (project convention: application.yml lives in xxx-starter).

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-flex:
  global-config:
    logic-delete-field: deleted
    logic-delete-value: "true"
    logic-not-delete-value: "false"

sa-token:
  token-name: Authorization
  timeout: 28800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

auth:
  # 三渠道会话时效独立配置
  # - netapp: 互联网渠道（NETAPP），默认 2 小时
  # - teller: 总行柜员渠道（TELLER），默认 8 小时
  # - bank-branch: 分行柜员渠道（BANK_BRANCH），默认 8 小时
  channel-session:
    netapp:
      timeout: 2h
    teller:
      timeout: 8h
    bank-branch:
      timeout: 8h

  secondary-auth:
    # 授权策略（sms-code / face-recognition / ukey-signature）
    strategy: sms-code

    # 待授权超时时间（默认 5 分钟）
    pending-timeout: 5m

    # 授权后会话过期时间（默认 2 小时）
    session-timeout: 2h

    # 权限快照 TTL（默认 30 秒）
    snapshot-ttl: 30s

    # 验证码长度（默认 6 位）
    verification-code-length: 6

    # 验证码最大重试次数（默认 3 次）
    verification-max-attempts: 3

    # 短信发送开关（测试环境可关闭）
    sms-enabled: true
