server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
  port: 18085

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true
  http:
    client:
      factory: http-components
      pool:
        max-total: 100
        max-per-route: 20
        validate-after-inactivity: 5s
      settings:
        connect-timeout: 3s
        read-timeout: 30s
        connection-time-to-live: 30s
  profiles:
    # 无显式 profile 时按本机开发运行；生产必须显式指定 --spring.profiles.active=prod
    default: local

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml

shared:
  cache:
    mode: L1_ONLY
    rules:
      segment_buffer:
        mode: L1_ONLY
        ttl: 24h
      # 权限缓存（收编至 shared-cache：原 RedisPermissionCacheStore 自建行为对等迁移）
      auth-perm-cache:
        ttl: 300s
        mode: L2_ONLY
      auth-menu-node:
        ttl: 30m
        mode: L1_ONLY

# sa-token 配置（多渠道会话管理）——环境无关，自 application-local.yml 迁入
sa-token:
  token-name: Authorization
  timeout: 28800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 多级缓存（jetcache 2.8 公共与本地段；remote 的 Redis 连接属环境相关，在 application-local.yml）
jetcache:
  statIntervalMinutes: 5
  areaInCacheName: false
  local:
    default:
      type: caffeine
      limit: 200

trace:
  context:
    mapping:
      OrderId: X-Order-Id
      UserId: X-User-Id
      BizId: X-Biz-Id
      BatchId: X-Batch-Id

logging:
  file:
    path: /applog/${spring.application.name}
    name: ${spring.application.name}.log
  logback:
    rollingpolicy:
      total-size-cap: 1GB
      max-history: 30
