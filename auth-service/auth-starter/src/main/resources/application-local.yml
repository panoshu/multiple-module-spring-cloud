# 本机环境配置：注册中心 / Redis / 数据库连接、脱敏策略与调试日志级别
# （sa-token、jetcache 公共与 local 段为环境无关配置，已迁至 application.yml）
spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: redis
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# shared-logging-starter 脱敏策略（环境相关的安全配置）
shared:
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
            - $.passwordHash
          strategy: FULL

# 多级缓存 remote 段（Redis 连接属环境相关；公共与 local 段在 application.yml）
jetcache:
  remote:
    default:
      type: redis.lettuce
      uri: redis://:redis@127.0.0.1:6379/0
      broadcastChannel: auth-service
      valueEncoder: java
      valueDecoder: java

logging:
  level:
    com.example.auth: DEBUG
    org.springframework.web: DEBUG
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR
