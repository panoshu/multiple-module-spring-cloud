# 测试环境配置 (H2 内存数据库 + PostgreSQL 兼容模式)
# 演示用：禁用 Nacos / Redis，仅验证业务编排链路
spring:
  autoconfigure:
    exclude:
      # 禁用 Nacos 服务发现自动配置（测试环境无需注册中心）
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosServiceRegistryAutoConfiguration
      - com.alibaba.cloud.nacos.NacosAutoConfiguration
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryClientConfiguration
      # 禁用 Retrofit 日志自动配置（测试环境无 logbook-okhttp 依赖，会触发 NoClassDefFoundError）
      - com.example.shared.client.autoconfigure.ClientAutoConfiguration
      # 禁用 Redisson 自动配置（测试环境无需 Redis，sa-token 使用默认内存存储）
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV1
      # 禁用 Spring Data Redis 自动配置（避免 RedisTemplate 触发 Redisson 连接）
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # 禁用 sa-token Redis DAO 自动配置（测试环境使用默认内存存储 SaTokenDaoDefaultImpl）
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:iam_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml

# sa-token 测试配置
sa-token:
  token-name: satoken
  timeout: 28800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# IAM 渠道配置 (测试环境)
iam:
  security:
    channels:
      internet:
        timeout: 28800
        active-timeout: 1800
        is-concurrent: true
      hq:
        timeout: 28800
        active-timeout: 1800
        is-concurrent: true
      branch:
        timeout: 28800
        active-timeout: 1800
        is-concurrent: false
    secondary-auth:
      session-timeout: 7200
      pending-timeout: 300
      max-pending-per-teller: 1
    permission:
      combination-strategy: priorityOverrideStrategy
      subject-priority:
        - ACCOUNT_MANAGER
        - PLAN
        - PRODUCT
        - OPERATION_MODE
        - CUSTOMER
      cache-timeout: 1800
      cache-null: true

# shared-logging-starter 的 SanitizationProperties 强制校验 @NotNull global 和 @NotEmpty fields
# 测试环境不实际使用脱敏，仅提供最小合法配置让上下文绑定通过
shared:
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
            - $.secretHash
          strategy: FULL
      strategies:
        FULL: { }
  # 测试环境禁用 L2 缓存(Redis),仅使用 L1 本地缓存(Caffeine)
  cache:
    mode: L1_ONLY

logging:
  level:
    root: WARN
    com.example: INFO
    com.example.iam: DEBUG
    org.springframework: WARN
    com.alibaba.nacos: OFF
    com.alibaba.cloud.nacos: OFF
