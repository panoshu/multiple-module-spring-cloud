spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848
    loadbalancer:
      enabled: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/pgdb?currentSchema=schema_iam&timezone=Asia/Shanghai
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms

# shared-logging-starter 脱敏配置
shared:
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
            - $.secretHash
            - $.oldSecretHash
          strategy: FULL

logging:
  level:
    root: INFO
    com.example: INFO
    com.example.shared.web.trace: INFO
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR
