server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
  port: 18081

spring:
  application:
    name: consumer
  threads:
    virtual:
      enabled: true
  http:
    client:
      factory: http-components
      # 全局连接池配置
      pool:
        max-total: 100
        max-per-route: 20
        validate-after-inactivity: 5s
      # 全局超时配置
      settings:
        connect-timeout: 3s
        read-timeout: 30s
        connection-time-to-live: 30s
  profiles:
    include: local

http-exchange:
  channels:
    - base-url: http://outbound
      read-timeout: 60000  # Channel-level timeout (in milliseconds)
      clients:
        - com.example.outbound.api.*Api

shared:
  cache:
    mode: L1_ONLY # ID生成器所在服务建议只用L1
    rules:
      segment_buffer: # 定义专门的号段缓存空间
        mode: L1_ONLY
        ttl: 24h

trace:
  context:
    mapping:
      # key(别名) : value(真实Header)
      OrderId: X-Order-Id
      UserId: X-User-Id
      BizId: X-Biz-Id
      BatchId: X-Batch-Id

logging:
  file:
    path: /applog/${spring.application.name}
    name: ${spring.application.name}.log
  logback:
    rollingpolicy:
      total-size-cap: 1GB
      max-history: 30
