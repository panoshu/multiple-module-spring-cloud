schemaId: "employee_write_scratch"
bizType: "EMPLOYEE_ONBOARDING"
type: "WRITE"
renderMode: "SCRATCH"
regions:
  - id: "detail_scratch_region"
    type: "HORIZONTAL_TABLE"
    tableMeta:
      dataStartRow: 1 # 从第1行开始写入数据
    staticElements:
      - cell: { row: 0, col: 0 }
        text: "序号"
      - cell: { row: 0, col: 1 }
        text: "姓名"
    fields:
      - jsonKey: "xh"
        staticHeaderName: "序号"
      - jsonKey: "xm"
        staticHeaderName: "姓名"
      - jsonKey: "ext_info.CJJHRQ"
        staticHeaderName: "参加计划日期"
        colOffset: 2 # 跳过中间列
