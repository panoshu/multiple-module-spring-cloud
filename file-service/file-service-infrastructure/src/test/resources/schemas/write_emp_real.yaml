schemaId: "write_emp_real"
bizType: "EMPLOYEE_ONBOARDING"
type: "WRITE"
renderMode: "CREATE"
regions:
  # 🟢 第一区：企业头部信息
  - regionId: "header_info"
    type: "DISCRETE"
    rows: 4
    fields:
      - jsonKey: "title_plan_num"
        fieldType: "TEXT_FIELD"
        label: "企业计划编号："
        locator: { strategy: "REGION_RELATIVE", row: 1, col: 1 }
      - jsonKey: "planNumber"
        fieldType: "DATA_FIELD"
        locator: { strategy: "REGION_RELATIVE", row: 1, col: 2 }
      - jsonKey: "title_plan_name"
        fieldType: "TEXT_FIELD"
        label: "企业计划名称："
        locator: { strategy: "REGION_RELATIVE", row: 1, col: 3 }
      - jsonKey: "planName"
        fieldType: "DATA_FIELD"
        locator: { strategy: "REGION_RELATIVE", row: 1, col: 4 }
      - jsonKey: "title_cust_num"
        fieldType: "TEXT_FIELD"
        label: "企业客户号："
        locator: { strategy: "REGION_RELATIVE", row: 2, col: 1 }
      - jsonKey: "customerNumber"
        fieldType: "DATA_FIELD"
        locator: { strategy: "REGION_RELATIVE", row: 2, col: 2 }
      - jsonKey: "title_cust_name"
        fieldType: "TEXT_FIELD"
        label: "企业客户名称："
        locator: { strategy: "REGION_RELATIVE", row: 2, col: 3 }
      - jsonKey: "customerName"
        fieldType: "DATA_FIELD"
        locator: { strategy: "REGION_RELATIVE", row: 2, col: 4 }
      - jsonKey: "title_notice"
        fieldType: "TEXT_FIELD"
        label: "请在填写表单之前仔细阅读填表说明，以免造成提交出错！"
        locator: { strategy: "REGION_RELATIVE", row: 4, col: 1 }

  # 🟢 第二区：动态表格区 (其高度会自动根据数据量向下延展)
  - regionId: "detail_table"
    type: "HORIZONTAL_TABLE"
    tableMeta:
      idRowIndex: 1
      nameRowIndex: 3
      dataStartRow: 4
      dataStartCol: 1
      endMarker: "如果在提交表单时本行以上部分存在空行，请将空行删除。" # 写入时自动在表格末尾追加这句话
      allowDynamicFields: true
      dynamicFieldPolicy: "AUTO_APPEND"
      dynamicFieldInternalIdPrefix: "DYN_"
    fields:
      - jsonKey: "empName"
        fieldType: "DATA_FIELD"
        locator: { strategy: "HEADER_MATCH", matchId: "XM", matchName: "个人姓名*" }
      - jsonKey: "idCard"
        fieldType: "DATA_FIELD"
        locator: { strategy: "HEADER_MATCH", matchId: "ZJHM", matchName: "证件编号*" }
      - jsonKey: "gender"
        fieldType: "DATA_FIELD"
        locator: { strategy: "HEADER_MATCH", matchId: "XB", matchName: "性别*" }
      - jsonKey: "birthDate"
        fieldType: "DATA_FIELD"
        locator: { strategy: "HEADER_MATCH", matchId: "CSRQ", matchName: "出生日期*" }

  # 🟢 第三区：浮动尾注！(紧跟在第二区表格结束标记的下一行渲染，完美解决相对排版)
  - regionId: "footer_info"
    type: "DISCRETE"
    rows: 4
    fields:
      - jsonKey: "end_flag"
        fieldType: "TEXT_FIELD"
        label: "结束"
        locator: { strategy: "REGION_RELATIVE", row: 1, col: 1 } # 尾注区第 1 行 A 列
      - jsonKey: "end_desc"
        fieldType: "TEXT_FIELD"
        label: "这个标志说明数据结束了"
        locator: { strategy: "REGION_RELATIVE", row: 1, col: 2 } # 尾注区第 1 行 B 列
      - jsonKey: "tips"
        fieldType: "TEXT_FIELD"
        label: "温馨提示：请确认提交无误"
        locator: { strategy: "REGION_RELATIVE", row: 3, col: 1 } # 尾注区第 3 行 A 列
