schemaId: "test_schema"
bizType: "EMPLOYEE_ONBOARDING"
type: "READ"
renderMode: "TEMPLATE"
splitStrategy:
  enabled: false
regions:
  - regionId: "t1"
    type: "HORIZONTAL_TABLE"
    tableMeta:
      idRowIndex: 1       # 🟢 1-based: 第一行是表头
      nameRowIndex: 2     # 🟢 1-based: 第二行是别名
      dataStartRow: 3     # 🟢 1-based: 第三行出数据
      dataStartCol: 1     # 🟢 1-based: 从 A 列 (1) 开始
      allowDynamicFields: false
      dynamicFieldPolicy: "STRICT"
    fields:
      - jsonKey: "empId"
        fieldType: "DATA_FIELD"
        label: "员工编号"
        dataType: "STRING"
        locator:
          strategy: "HEADER_MATCH"
          matchId: "ID"
