spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848 # nacos / tkEAaj3OIk
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai&stringtype=unspecified
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: redis

# 功能权限校验: 通过 HttpExchange 调用 auth-service
# 库 3.5.5 配置前缀为 http-exchange；旧的 httpexchange.clients.<包>.url 不生效
http-exchange:
  base-url: lb://auth-service

permission:
  # 会话签名验证：验证网关签发的 X-Account-Id / X-Session-Context 签名防伪造
  # 生产环境通过环境变量 PERMISSION_SESSION_SIGNATURE_KEY 注入
  session:
    signature-key: dev-session-signature-key-2026

# shared-logging-starter 脱敏配置（最小化满足 SanitizationProperties @NotNull/@NotEmpty 校验）
shared:
  # X-04：本地联调使用 RocketMQ 5 Proxy（gRPC 8081）；Redis 仅保留缓存/会话用途
  event:
    redis:
      enabled: false
    rocketmq:
      enabled: true
      endpoints: http://127.0.0.1:8081
      topic: event
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
          strategy: FULL

logging:
  level:
    root: INFO
    com.example: INFO
    com.example.shared.web.trace: INFO
    org.zalando.logbook: TRACE
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR

# 本地开发环境文件存储覆盖配置
file:
  # 本地联调播种 FORM_DETAIL 模板配置（无管理端时的便捷启动；生产禁止开启）
  demo:
    template-seed:
      enabled: true
      biz-type: FORM_DETAIL
      version: "1.0"
  storage:
    targets:
      - id: local-default
        type: LOCAL
        base-path: ${user.home}/.file-service/dev
      - id: oss-source
        type: LOCAL  # 本地开发强制 LOCAL，避免依赖 OSS
        base-path: ${user.home}/.file-service/dev/source
      - id: oss-export
        type: LOCAL
        base-path: ${user.home}/.file-service/dev/export
      - id: nas-shared
        type: LOCAL
        base-path: ${user.home}/.file-service/dev/nas
    routing:
      source: local-default
      export: oss-export
      parsed: oss-source
      archive: nas-shared
  # 本地开发环境 Token 密钥覆盖（仅本地使用，禁止提交真实密钥）
  token:
    secret-key: "MDEyMzQ1Njc4OWFiY2RlZg=="  # 16 字节 "0123456789abcdef" 的 Base64

# 多级缓存 remote 段（Redis 连接属环境相关；公共与 local 段在 application.yml）
jetcache:
  remote:
    default:
      type: redis.lettuce
      uri: redis://:redis@127.0.0.1:6379/0
      broadcastChannel: file-service
      valueEncoder: java
