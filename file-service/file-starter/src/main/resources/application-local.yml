spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848 # nacos / tkEAaj3OIk
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 56379
      database: 0
      password: redis

# 功能权限校验: 通过 HttpExchange 调用 auth-service 实时校验
httpexchange:
  clients:
    com.example.auth.api:
      url: lb://auth-service

permission:
  # 会话签名验证：验证网关签发的 X-Account-Id / X-Session-Context 签名防伪造
  # 生产环境通过环境变量 PERMISSION_SESSION_SIGNATURE_KEY 注入
  session:
    signature-key: dev-session-signature-key-2026

# shared-logging-starter 脱敏配置（最小化满足 SanitizationProperties @NotNull/@NotEmpty 校验）
shared:
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
          strategy: FULL

logging:
  level:
    root: INFO
    com.example: INFO
    com.example.shared.web.trace: INFO
    org.zalando.logbook: TRACE
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR

# 本地开发环境文件存储覆盖配置
file:
  storage:
    targets:
      - id: local-default
        type: LOCAL
        base-path: ${user.home}/.file-service/dev
      - id: oss-source
        type: LOCAL  # 本地开发强制 LOCAL，避免依赖 OSS
        base-path: ${user.home}/.file-service/dev/source
      - id: oss-export
        type: LOCAL
        base-path: ${user.home}/.file-service/dev/export
      - id: nas-shared
        type: LOCAL
        base-path: ${user.home}/.file-service/dev/nas
    routing:
      source: local-default
      export: oss-export
      parsed: oss-source
      archive: nas-shared
  # 本地开发环境 Token 密钥覆盖（仅本地使用，禁止提交真实密钥）
  token:
    secret-key: "MDEyMzQ1Njc4OWFiY2RlZg=="  # 16 字节 "0123456789abcdef" 的 Base64
