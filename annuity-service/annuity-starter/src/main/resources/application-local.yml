# 本机环境配置：注册中心 / Redis / 数据库连接、服务间客户端地址、签名密钥与调试日志级别
spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848 # nacos / tkEAaj3OIk
  # 本地 Redis：kernel 引入 shared-lock-starter 后，启动期 PING 校验与流程推进锁依赖此连接
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: redis
  datasource:
    # stringtype=unspecified：JSONB 列（如 t_annuity_employee_detail.materials）以 String 写入时，
    # 由 PostgreSQL 自行推断类型；缺失会报 "column is of type jsonb but expression is of type character varying"
    url: jdbc:postgresql://127.0.0.1:5432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai&stringtype=unspecified
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# HttpExchange 客户端（库 3.5.5 配置前缀为 http-exchange；旧 httpexchange.clients.<包>.url 不生效）
http-exchange:
  channels:
    - name: approval
      base-url: lb://approval-service
      clients:
        - com.example.approval.api.**
    - name: file
      base-url: lb://file-service
      clients:
        - com.example.file.api.**
    - name: integration
      base-url: lb://cjannuity-channel-integration
      clients:
        - com.example.integration.api.**
    - name: auth
      base-url: lb://auth-service
      clients:
        - com.example.auth.api.**

permission:
  # 会话签名验证：验证网关签发的 X-Account-Id / X-Session-Context 签名防伪造
  # 生产环境通过环境变量 PERMISSION_SESSION_SIGNATURE_KEY 注入
  session:
    signature-key: dev-session-signature-key-2026

# 跨服务事件通道：订阅 file-service 的 FileParsedEvent / approval-service 的审批结果事件
shared:
  event:
    redis:
      enabled: false
    rocketmq:
      enabled: true
      endpoints: http://127.0.0.1:8081
      topic: event

# 本机联调：文件网关走真实 file-service；客户画像仍用 Mock（外部主数据未接入）
annuity:
  demo:
    file-mock:
      enabled: false
    customer-mock:
      enabled: true

# kernel 真实文件网关（FileServiceIntegrationGateway + FileServiceClientConfiguration）
core:
  integration:
    file:
      base-url: http://127.0.0.1:18082

logging:
  level:
    com.example.annuity: DEBUG
    com.example.shared.web.trace: INFO
    org.zalando.logbook: TRACE
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR
