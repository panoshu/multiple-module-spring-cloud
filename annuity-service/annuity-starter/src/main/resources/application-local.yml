spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848 # nacos / tkEAaj3OIk
    loadbalancer:
      enabled: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# httpexchange 远程客户端配置：通过服务名 + LoadBalancer 调用 approval-service / file-service / integration
httpexchange:
  clients:
    com.example.approval.api:
      url: http://approval-service
    com.example.file.api:
      url: http://file-service
    com.example.integration.api:
      url: http://integration

# shared-logging-starter 脱敏配置（最小化满足 SanitizationProperties @NotNull/@NotEmpty 校验）
shared:
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
          strategy: FULL

logging:
  level:
    root: INFO
    com.example: INFO
    com.example.shared.web.trace: INFO
    org.zalando.logbook: TRACE
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR
