# 业务基线配置 - 企业计划表单
# 对应被解析的 Excel: docs/excel/示例表单.xlsx
# 文件: enterprise_plan_base.yaml
#
# 说明：
# - canonicalModel 使用业务语义命名（planNo/customerNo/seq/name 等），与具体表单列名解耦
# - 表单特定的列名映射在源模板配置中通过 labelAliases / headerAliases 配置
# - validationRules 的 expr 使用 Aviator 语法（!= nil 而非 != null）
# - splitConfig 按 idType 拆分（身份证 / 护照）

bizType: ENTERPRISE_PLAN
version: "1.0"
errorPolicy: COLLECT_ALL

# ── 1. 规范模型 ──
canonicalModel:
  properties:
    - { code: planNo,       type: STRING,  required: true }
    - { code: planName,     type: STRING,  required: true }
    - { code: customerNo,   type: STRING,  required: true }
    - { code: customerName, type: STRING,  required: true }
    - { code: filler,       type: STRING }
    - { code: reviewer,     type: STRING }
  tables:
    - code: employees
      fields:
        - { code: seq,    type: INTEGER, required: true }
        - { code: name,   type: STRING,  required: true }
        - { code: idType, type: STRING,  required: true }
        - { code: idNo,   type: STRING,  required: true }

# ── 2. 校验规则（Aviator 表达式，使用标准字段名）──
validationRules:
  - { field: idNo, scope: ROW, expr: "idNo != nil", message: "证件编号不能为空", type: STRING }
  - { field: name, scope: ROW, expr: "name != nil", message: "姓名不能为空",     type: STRING }

derivationRules: [ ]

# ── 3. 拆分配置（按 employees.idType 拆分）──
splitConfig:
  keys: [ idType ]
  splitKey:
    targetField: idType
    sourcePath: employees.idType
    type: FIELD_VALUE
  onMiss: ERROR
  maxRowsPerSubTask: 1000
