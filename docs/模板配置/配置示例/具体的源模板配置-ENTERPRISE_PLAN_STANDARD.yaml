# 源模板配置 - 企业计划标准模板
# 对应被解析的 Excel: docs/excel/示例表单.xlsx
# 文件: ENTERPRISE_PLAN_STANDARD.yaml
#
# 说明：
# - id 为源模板唯一编码（YamlConfigLoader 解析为 TemplateCode）
# - identifyMode=AUTO + fingerprint 用于自动识别 Excel 类型
# - regions 定义区域布局流，状态机按顺序自动流转
# - labelAliases / headerAliases 将表单标签/列名映射到 canonicalModel 中的标准字段 code
#
# Excel 实测结构（Sheet1, A1:AP15, 42 列 × 15 行）：
#   R1: 企业计划编号：| 0200010001 | 企业计划名称：| 企业计划A
#   R2: 企业客户号：  | 000234     | 企业客户名称：| 客户A
#   R3: (空行)
#   R4: 请在填写表单之前仔细阅读填表说明... (说明行，跳过)
#   R5: XH | XM | ZJLX | ZJHM | ... (42 列代码行，作为列名识别行)
#   R6: 基本信息 | ... (合并单元格分组标题，跳过)
#   R7: 序号* | 个人姓名* | 证件类型* | ... (42 列中文表头，跳过)
#   R8: 1 | 张内Aa01 | 身份证 | 999000198608060000 | ... (数据行 1)
#   R9: 2 | 张内Aa02 | 护照   | 999000198608060000 | ... (数据行 2)
#   R10: 3 | 张内Aa03 | 身份证 | 999000198608060000 | ... (数据行 3)
#   R11: 结束 | 如果在提交表单时本行以上部分存在空行... (结束标记)
#   R12: 填表人: | 张三 | 复核人： | 李四
#   R13-R15: 填表说明 (跳过)
#
# 关键配置点：
# - basic_info 只映射 customerNo/customerName（与现有 ExportFlowIntegrationTest 一致，
#   避免触发逻辑复杂化；planNo/planName 在 canonicalModel 中定义但不映射）
# - employee_list: headerRows=3 (R5 代码 + R6 分组 + R7 中文), headerNameRow=1 (用 R5 代码行识别)
# - headerAliases 将代码 XH/XM/ZJLX/ZJHM 映射到标准字段 seq/name/idType/idNo
# - filler_info: 填表人 label 用英文冒号 '填表人:'，复核人 label 用中文冒号 '复核人：'（实测）

id: ENTERPRISE_PLAN_STANDARD
name: "企业计划标准模板"
identifyMode: AUTO
fingerprint: ["企业计划编号：", "企业客户号：", "XH"]

regions:
  # 区域 1：头部 KV（R2 企业客户号/企业客户名称）
  - name: basic_info
    type: KEY_VALUE
    bindTo: properties
    trigger: { matchType: HEADER_SNIFF, minMatchCount: 2 }
    strategy:
      valuePosition: RIGHT
      labelAliases:
        customerNo:   ["企业客户号："]
        customerName: ["企业客户名称："]
      maxBlankRows: 2

  # 区域 2：员工明细表格（R5 表头 + R8-R10 数据 + R11 结束标记）
  - name: employee_list
    type: TABLE
    bindTo: employees
    trigger: { matchType: HEADER_SNIFF, minMatchCount: 5 }
    strategy:
      headerRows: 3            # 共 3 行表头（R5 代码 + R6 分组 + R7 中文）
      headerNameRow: 1         # 1-based，用第 1 行（R5 代码 XH/XM/ZJLX/ZJHM）作为识别列名
      matchBy: HEADER_NAME
      headerAliases:
        seq:    [XH]
        name:   [XM]
        idType: [ZJLX]
        idNo:   [ZJHM]
      dataEnd: { markers: ["结束"], blankRowCount: 1 }

  # 区域 3：填表人信息（R12）
  - name: filler_info
    type: KEY_VALUE
    bindTo: properties
    trigger: { matchType: HEADER_SNIFF, minMatchCount: 1 }
    strategy:
      valuePosition: RIGHT
      labelAliases:
        filler:   ["填表人:"]
        reviewer: ["复核人："]
      maxBlankRows: 1
