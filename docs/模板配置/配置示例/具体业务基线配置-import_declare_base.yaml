# 业务基线配置, 对应每个业务的标准数据模型
# 文件: import_declare_base.yaml
bizType: IMPORT_DECLARE
version: "2.0.0"
errorPolicy: COLLECT_ALL

# ── 1. 规范模型 ──
canonicalModel:
  properties:
    - { code: enterpriseName, type: string, required: true }
    - { code: declareDate,    type: date,   required: true }
  tables:
    - code: detailList
      fields:
        - { code: itemNo,   type: string, required: true }
        - { code: deptCode, type: string, required: true } # 拆分键
        - { code: amount,   type: decimal, scale: 2 }

# ── 2. 校验与计算 ──
validation:
  crossField:
    - { scope: ROW, expr: "amount > 0", message: "金额必须大于0" }
derivation:
  - { field: detailList.amount, expr: "round(qty * unitPrice, 2)" }

# ── 3. 拆分逻辑 ──
split:
  keys: [detailList.deptCode]           # 按明细中的部门代码拆分
  onMiss: DEFAULT:GENERAL_DEPT          # 未匹配到的归入通用部门
  fileNaming: "DECLARE_{splitKey.deptCode}_{seq:03}.xlsx"
  promoteToContext: true                # 将拆分出的 deptCode 注入上下文，用于映射

# ── 4. 目标映射 (Target Mapping) ──
target:
  template:
    file: "templates/external_template.xlsx"
  mapping:
    header:
      - { target: ent_name,   from: properties.enterpriseName }
      # 利用拆分逻辑提升的 context，自动填入目标表单头部
      - { target: dept_name,  from: context.deptCode }
      # 业务系统运行时回注的流水号
      - { target: trade_no,   from: context.systemTradeNo }
    detail:
      - { target: c_item_no,  from: detailList.itemNo }
      - { target: c_amount,   from: detailList.amount, converter: "round:2" }
