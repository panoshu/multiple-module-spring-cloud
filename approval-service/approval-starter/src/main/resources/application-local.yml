spring:
  cloud:
    nacos.discovery.server-addr: 127.0.0.1:8848 # nacos / tkEAaj3OIk
  # 本地 Redis：与 auth/file/annuity 保持同一连接配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      password: redis
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/pgdb?currentSchema=schema_demo&timezone=Asia/Shanghai
    username: user_demo
    password: passwd_demo
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 功能权限校验/角色目录: 通过 HttpExchange 调用 auth-service
# 库 3.5.5 配置前缀为 http-exchange；旧的 httpexchange.clients.<包>.url 不生效
http-exchange:
  base-url: lb://auth-service

permission:
  # 会话签名验证：验证网关签发的 X-Account-Id / X-Session-Context 签名防伪造
  # 生产环境通过环境变量 PERMISSION_SESSION_SIGNATURE_KEY 注入
  session:
    signature-key: dev-session-signature-key-2026

# 跨服务事件通道：审批结果事件经 Redis 发布到 kernel（annuity-service）
shared:
  event:
    redis:
      enabled: false
    rocketmq:
      enabled: true
      endpoints: http://127.0.0.1:8081
      topic: event
  # shared-logging-starter 脱敏配置（最小化满足 SanitizationProperties @NotNull/@NotEmpty 校验）
  logging:
    obfuscate:
      global:
        enable: false
        replacement: "***"
        enable-wildcard-paths: false
      fields:
        password:
          aliases:
            - $.password
          strategy: FULL

logging:
  level:
    com.example.approval: DEBUG
    com.example.approval.infrastructure.mapper: DEBUG
    org.springframework.web: DEBUG
    com.alibaba.nacos: ERROR
    com.alibaba.cloud.nacos: ERROR
