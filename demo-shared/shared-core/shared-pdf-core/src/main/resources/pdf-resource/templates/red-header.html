<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="author" th:content="${pdfMeta.author}"/>
  <meta name="keywords" th:content="${pdfMeta.keywords}"/>
  <meta name="subject" th:content="${pdfMeta.subject}"/>

  <title th:text="${pdfMeta.title} ?: '公文预览'">公文通知</title>
  <style>
    /* ================== 红头文件专用样式 (自包含) ================== */
    @page {
      size: A4;
      /* 标准公文页边距：上37mm 下35mm 左28mm 右26mm */
      margin: 37mm 26mm 35mm 28mm;
      @bottom-center {
        content: element(footerHtml);
      }
    }

    body {
      /* 对应 Java 中配置的 family-name: SimSun */
      font-family: 'SimSun', serif;
      font-size: 16pt; /* 三号字 */
      line-height: 1.8;
      margin: 0;
      color: #000;
    }

    /* 1. 红头区域 */
    .gov-header {
      text-align: center;
      border-bottom: 2px solid red;
      padding-bottom: 10px;
      margin-bottom: 40px;
      /* 确保红头即使在翻页时也只出现在第一页(默认文档流行为) */
    }

    .gov-org {
      font-family: 'SimHei', serif; /* 黑体 */
      font-size: 32pt;
      font-weight: bold;
      color: red;
      letter-spacing: 5px;
    }

    .gov-doc-no {
      margin-top: 15px;
      font-size: 12pt;
      font-family: 'SimSun', serif; /* 仿宋/宋体 */
      color: #000;
    }

    /* 2. 标题与正文 */
    .doc-title {
      font-family: 'SimHei', serif;
      font-size: 22pt; /* 二号 */
      text-align: center;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .doc-body {
      font-family: 'SimSun', serif; /* 仿宋 */
      text-indent: 2em;
      text-align: justify;
    }

    .signature-box {
      margin-top: 60px;
      text-align: right;
      margin-right: 2em;
      line-height: 2;
    }

    /* 3. 页脚 (定义为 Running Element) */
    .gov-footer {
      position: running(footerHtml);
      text-align: center;
      font-size: 12pt;
      font-family: 'SimSun', serif;
    }

    .page-num::before {
      content: counter(page);
    }
  </style>
</head>
<body>

<div class="gov-header">
  <div class="gov-org" th:text="${orgName} + '文件'">信息技术部文件</div>
  <div class="gov-doc-no" th:text="${docNo}">信发[2026] 101号</div>
</div>

<div class="doc-title" th:text="${mainTitle}">关于系统升级的通知</div>

<div class="doc-body" th:utext="${bodyHtml}">
  <p>各部门：</p>
  <p>系统将于今晚进行升级，请做好准备。</p>
</div>

<div class="signature-box">
  <div th:text="${orgName}">信息技术部</div>
  <div th:text="${#temporals.format(#temporals.createNow(), 'yyyy年MM月dd日')}">2026年01月24日</div>
</div>

<div class="gov-footer">
  — <span class="page-num"></span> —
</div>

</body>
</html>
