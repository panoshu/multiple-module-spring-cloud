<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="author" th:content="${pdfMeta.author}"/>
  <meta name="keywords" th:content="${pdfMeta.keywords}"/>
  <meta name="subject" th:content="${pdfMeta.subject}"/>

  <title th:text="${pdfMeta.title} ?: '报表预览'">月度报表</title>
  <style>
    /* ================== 报表专用样式 ================== */
    @page {
      size: A4 landscape; /* 横向 */
      margin: 15mm;
      @bottom-right {
        content: element(footerHtml);
      }
    }

    body {
      font-family: 'SimSun', serif;
      font-size: 10pt; /* 报表字号通常较小 */
      margin: 0;
    }

    /* 1. 标题区 */
    .rep-title {
      text-align: center;
      font-size: 18pt;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .rep-info {
      display: table;
      width: 100%;
      margin-bottom: 10px;
      font-size: 10pt;
    }

    .info-left {
      display: table-cell;
      text-align: left;
    }

    .info-right {
      display: table-cell;
      text-align: right;
    }

    /* 2. 数据表格 (核心) */
    table {
      width: 100%;
      border-collapse: collapse;
      /* 关键：让长表格在分页时自动重复表头 */
      -fs-table-paginate: paginate;
    }

    th, td {
      border: 1px solid #999;
      padding: 6px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }

    /* 斑马纹 */
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* 金额列右对齐 */
    .col-amt {
      text-align: right;
      font-family: 'Arial', sans-serif;
    }

    /* 3. 页脚 */
    .rep-footer {
      position: running(footerHtml);
      text-align: right;
      font-size: 9pt;
      color: #666;
    }

    .page-info::after {
      content: "Page " counter(page) " of " counter(pages);
    }
  </style>
</head>
<body>

<div class="rep-title" th:text="${reportTitle}">2026年1月 交易流水明细</div>

<div class="rep-info">
  <div class="info-left">报表编号: RPT-202601-001</div>
  <div class="info-right">
    打印时间: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm')}">2026-01-24 12:00</span>
  </div>
</div>

<table>
  <thead>
  <tr>
    <th style="width: 15%">日期</th>
    <th style="width: 20%">交易类别</th>
    <th style="width: 20%">金额 (元)</th>
    <th style="width: 45%">备注摘要</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="item : ${items}">
    <td th:text="${item.date}">2026-01-01</td>
    <td th:text="${item.category}">在线支付</td>
    <td class="col-amt" th:text="${item.amount}">199.00</td>
    <td style="text-align: left;" th:text="${item.remark}">京东购物</td>
  </tr>

  <tr th:if="${items == null}">
    <td>2026-01-01</td>
    <td>示例数据</td>
    <td class="col-amt">999.00</td>
    <td style="text-align: left;">这是一个预览行</td>
  </tr>
  </tbody>
</table>

<div class="rep-footer">
  <span class="page-info"></span> | Internal Use Only
</div>

</body>
</html>
