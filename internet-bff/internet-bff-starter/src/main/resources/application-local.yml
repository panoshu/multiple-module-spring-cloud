# 本机环境配置：注册中心连接与服务间客户端地址、调试日志级别
spring:
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}

# httpexchange 客户端配置（库 io.github.danielliu1123:httpexchange 3.5.5）。
# 配置前缀为 http-exchange（连字符），结构为 base-url（全局）+ channels[]（name/base-url/clients）。
# 旧写法 httpexchange.clients.<package>.url 在 3.5.5 中不存在，配了也不生效（批次 73 端到端发现）。
# internet-bff 仅调用 annuity-service，使用全局 base-url 即可。
http-exchange:
  base-url: lb://annuity-service

logging:
  level:
    com.example.bff: DEBUG
