server:
  port: 18092
  servlet:
    context-path: /internet-bff

spring:
  application:
    name: internet-bff
  threads:
    virtual:
      enabled: true
  profiles:
    # 无显式 profile 时按本机开发运行；生产必须显式指定 --spring.profiles.active=prod
    default: local

# BFF 渠道范围
bff:
  channel-scope: INTERNET

trace:
  context:
    mapping:
      OrderId: X-Order-Id
      UserId: X-User-Id
      BizId: X-Biz-Id
      BatchId: X-Batch-Id
