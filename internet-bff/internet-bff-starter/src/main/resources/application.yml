server:
  port: 18090
  servlet:
    context-path: /internet-bff

spring:
  application:
    name: internet-bff
  threads:
    virtual:
      enabled: true
  profiles:
    active: local

# BFF 渠道范围
bff:
  channel-scope: INTERNET

trace:
  context:
    mapping:
      OrderId: X-Order-Id
      UserId: X-User-Id
      BizId: X-Biz-Id
      BatchId: X-Batch-Id

logging:
  level:
    com.example.bff: DEBUG
